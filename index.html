<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple way to create QRCodes!">
    <meta property="og:title" content="QrCode Generator">
    <meta property="og:description" content="A simple way to create QRCodes!">
    <link rel="icon" href="qrCodeIcon.svg">
    <link rel="stylesheet" href="style.css">
    <title>QrCode Generator</title>
</head>
<body>
    <header class="header">
        <div>
            <img src="qrCodeIcon.svg" alt="Icon" class="icon">
            <p>QrCode Generator</p>
        </div>
    </header>

    <main class="main">

        <section class="qrCodeContainer">
            <img src="qrCodeIcon.svg" alt="QrCode" class="qrCodeResult">
        </section>

        <section class="group-inputs">
            <h2>Configurations</h2>
            <div class="data">
                <input type="text" id="contentInput" placeholder="Text/Link here">

                <h3>Color:</h3>
                <div class="colors-row">
                    <button class="yellow color-button" id="yellowColorButton"></button>
                    <button class="blue color-button" id="blueColorButton"></button>
                    <button class="green color-button" id="greenColorButton"></button>
                    <button class="red color-button" id="redColorButton"></button>
                    <button class="white color-button selected-button" id="whiteColorButton"></button>
                </div>

                <h3>Finder Style:</h3>
                <select id="finderDotStyle">
                    <option value="square" selected>square</option>
                    <option value="round">round</option>
                    <option value="dot">dot</option>
                </select>

                <h3>Caption:</h3>
                <input type="text" id="captionInput">
            </div>

            <button id="generateButton">Generate</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
